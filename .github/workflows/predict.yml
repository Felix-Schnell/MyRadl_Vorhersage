name: Update prediction map

on:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: myradl-predict
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken (main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements-model.txt

      - name: Zuletzt trainierte Modelle holen
        run: |
          git fetch origin models
          git worktree add models-branch models
          mkdir -p model/artifacts
          cp models-branch/*.json model/artifacts/

      - name: Vorhersagen generieren
        working-directory: model
        run: python generate_predictions.py

      - name: gh-pages-Branch auschecken
        run: |
          git fetch origin gh-pages 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add gh-pages-branch gh-pages
          else
            git worktree add --detach gh-pages-branch
            cd gh-pages-branch
            git switch --orphan gh-pages
            git rm -rf --cached . >/dev/null 2>&1 || true
            find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          fi

      - name: docs in gh-pages-Branch kopieren
        run: |
          rsync -a --delete docs/ gh-pages-branch/

      - name: Karte committen und pushen
        working-directory: gh-pages-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Update predictions $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push origin HEAD:gh-pages
          else
            echo "Keine Aenderungen, kein Commit noetig."
          fi
