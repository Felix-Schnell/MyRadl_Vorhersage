name: Update prediction map

on:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: myradl-predict
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken (main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements-model.txt

      - name: Zuletzt trainierte Modelle holen
        run: |
          git fetch origin models
          mkdir -p model/artifacts
          git archive origin/models | tar -x -C model/artifacts

      - name: Vorhersagen generieren
        working-directory: model
        run: python generate_predictions.py

      - name: Karte auf gh-pages-Branch committen und pushen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/gh-pages-out && mkdir -p /tmp/gh-pages-out
          cd /tmp/gh-pages-out
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch --quiet origin gh-pages 2>/dev/null && git checkout -q -b gh-pages FETCH_HEAD || git checkout -q --orphan gh-pages
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -r "$GITHUB_WORKSPACE"/docs/. .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -q -m "Update predictions $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push origin HEAD:gh-pages
          else
            echo "Keine Aenderungen, kein Commit noetig."
          fi
