name: Train prediction model

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: myradl-train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken (main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements-model.txt

      - name: Modelle trainieren
        working-directory: model
        run: python train.py

      - name: Modelle auf models-Branch committen und pushen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/models-out && mkdir -p /tmp/models-out
          cd /tmp/models-out
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch --quiet origin models 2>/dev/null && git checkout -q -b models FETCH_HEAD || git checkout -q --orphan models
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp "$GITHUB_WORKSPACE"/model/artifacts/*.json .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -q -m "Train models $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push origin HEAD:models
          else
            echo "Keine Aenderungen, kein Commit noetig."
          fi
