name: Train prediction model

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: myradl-train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken (main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements-model.txt

      - name: Modelle trainieren
        working-directory: model
        run: python train.py

      - name: models-Branch auschecken
        run: |
          git fetch origin models 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/models; then
            git worktree add models-branch models
          else
            git worktree add --detach models-branch
            cd models-branch
            git switch --orphan models
            git rm -rf --cached . >/dev/null 2>&1 || true
            find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          fi

      - name: Trainierte Modelle in models-Branch kopieren
        run: |
          rsync -a --delete model/artifacts/ models-branch/

      - name: Modelle committen und pushen
        working-directory: models-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Train models $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push origin HEAD:models
          else
            echo "Keine Aenderungen, kein Commit noetig."
          fi
