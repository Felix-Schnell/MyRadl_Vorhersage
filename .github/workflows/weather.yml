name: Collect weather data

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: myradl-weather
  cancel-in-progress: false

jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken (main)
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install requests python-dotenv

      - name: Daten-Branch auschecken
        run: |
          git fetch origin data 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git worktree add data-branch data
          else
            git worktree add --detach data-branch
            cd data-branch
            git switch --orphan data
            git rm -rf --cached . >/dev/null 2>&1 || true
            find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          fi

      - name: Wetter pollen
        working-directory: collector
        env:
          MYRADL_DATA_DIR: ${{ github.workspace }}/data-branch
        run: python weather.py --once

      - name: Daten committen und pushen
        working-directory: data-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Weather poll $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push origin HEAD:data
          else
            echo "Keine Aenderungen, kein Commit noetig."
          fi
